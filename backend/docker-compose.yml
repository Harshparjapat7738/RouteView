# Local development database: PostgreSQL + PostGIS only.
#
#   docker compose up -d      start (creates the volume on first run)
#   docker compose stop       stop, data is kept
#   docker compose down       remove the container, data is kept in the volume
#   docker compose down -v    remove the container AND delete all data
#
# Compose reads backend/.env automatically (run the commands from this directory),
# the same file Spring Boot reads. Copy .env.example to .env and set POSTGRES_PASSWORD first.

name: routeview

services:
  db:
    # PostgreSQL 16 + PostGIS 3.4. Override with POSTGIS_IMAGE (e.g. on ARM machines without an arm64 image).
    image: ${POSTGIS_IMAGE:-postgis/postgis:16-3.4}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-routeview}
      POSTGRES_USER: ${POSTGRES_USER:-routeview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      # Bound to localhost only: the development database is not reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - routeview-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  routeview-pgdata:
